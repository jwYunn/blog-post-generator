# Routing for the blog stack. Runs as the nginx service in docker-compose and is
# reached only through the Cloudflare Tunnel - the host publishes no port for it,
# so there is no way to hit the origin without passing Cloudflare Access first.
# TLS is terminated by Cloudflare; the tunnel leg is already encrypted, which is
# why this server block is plain HTTP with no certificate of its own.

server {
    listen 80;
    server_name _;

    # Thumbnails are fetched and uploaded server-side, so requests stay small
    client_max_body_size 10m;

    # Real client IP arrives from cloudflared rather than the socket
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Docker's embedded DNS. Needed for the runtime resolution below.
    resolver 127.0.0.11 valid=10s;

    # ─── API ────────────────────────────────────────────────────────────────
    # The trailing slash strips the /api prefix, so the app keeps serving its
    # routes at the root (/topic-seeds, /article-drafts, ...).
    location /api/ {
        proxy_pass http://app:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation endpoints only enqueue a job and return, but leave headroom
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ─── Bull dashboard ─────────────────────────────────────────────────────
    # No auth here on purpose: Cloudflare Access is the only way in, and adding
    # basic auth would mean keeping an .htpasswd secret on the server. To gate it
    # more tightly, add a separate Access policy for this path in the dashboard.
    # No trailing slash: Bull Board is mounted at /queues and serves its own
    # assets from under that path.
    location /queues {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://app:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Frontend ───────────────────────────────────────────────────────────
    # Resolved per request rather than at startup. A static upstream name makes
    # nginx refuse to boot while the frontend container does not exist yet, which
    # would take the API down with it; this way an absent frontend is a 502 on
    # this location alone.
    location / {
        set $fe_upstream http://fe:80;
        proxy_pass $fe_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
