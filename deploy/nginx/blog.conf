# Routing for the blog stack. Runs as the nginx service in docker-compose and is
# reached only through the Cloudflare Tunnel - the host publishes no port for it,
# so there is no way to hit the origin without passing Cloudflare Access first.
# TLS is terminated by Cloudflare; the tunnel leg is already encrypted, which is
# why this server block is plain HTTP with no certificate of its own.

server {
    listen 80;
    server_name _;

    # Thumbnails are fetched and uploaded server-side, so requests stay small
    client_max_body_size 10m;

    # Real client IP arrives from cloudflared rather than the socket
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Docker's embedded DNS. Every upstream below goes through a variable so
    # that nginx resolves it per request instead of pinning the IP it saw at
    # startup - container IPs change whenever a service is recreated, which a
    # deploy does on every run.
    resolver 127.0.0.11 valid=10s;

    set $app_upstream http://app:3000;
    set $fe_upstream http://fe:80;

    # ─── API ────────────────────────────────────────────────────────────────
    # The rewrite strips the /api prefix, so the app keeps serving its routes at
    # the root (/topic-seeds, /article-drafts, ...). A trailing slash on
    # proxy_pass would do the same, but only for a literal upstream - and a
    # literal upstream is resolved once at startup and cached forever, so every
    # deploy that lands the app on a new container IP would 502 until nginx was
    # restarted. Going through $app_upstream forces per-request resolution;
    # rewrite then has to strip the prefix by hand, because the trailing-slash
    # form does not apply when proxy_pass carries a variable.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation endpoints only enqueue a job and return, but leave headroom
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ─── Bull dashboard ─────────────────────────────────────────────────────
    # No auth here on purpose: Cloudflare Access is the only way in, and adding
    # basic auth would mean keeping an .htpasswd secret on the server. To gate it
    # more tightly, add a separate Access policy for this path in the dashboard.
    # No trailing slash: Bull Board is mounted at /queues and serves its own
    # assets from under that path.
    # No rewrite: with a variable and no URI part, proxy_pass forwards the
    # original request URI unchanged, which is what Bull Board needs.
    location /queues {
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Frontend ───────────────────────────────────────────────────────────
    # Per-request resolution buys one more thing here: a literal upstream name
    # makes nginx refuse to boot while this container does not exist, which
    # would take the API down with it. An absent frontend stays a 502 on this
    # location alone.
    location / {
        proxy_pass $fe_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
